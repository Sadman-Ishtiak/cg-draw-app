[package]
name = "cg-draw-app"
version = "0.1.0"
edition = "2021"
description = "Offline Computer Graphics course IDE: BGI-style C++ editor with live animated canvas"

[lib]
name = "cg_draw_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
